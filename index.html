    <title>Ang Sangyaw</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f9f9f9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #25235c;
            padding: 10px 20px;
            color: white;
            position: relative;
        }
        .logo {
            height: 175px; 
        }
        .title-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }
        .title-image {
            height: 175px; 
        }
        .menu-button {
            font-size: 1.5em;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            position: absolute;
            right: 55px;
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #25235c;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }
        .sidebar input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 20px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
        }
        .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 1.5em;
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            color: white;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #25235c;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.5em;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }
        #main {
            transition: margin-left 0.3s;
            padding: 20px;
        }

        .section {
            display: none;
            padding: 50px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .active-section {
            display: block;
        }

        .welcome-container {
            text-align: center;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 40px;
        }
        .welcome-container h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.5em;
            color: #25235c;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .welcome-container p {
            font-family: 'Open Sans', sans-serif;
            font-size: 1.2em;
            color: #333;
            line-height: 1.5;
        }

        .blank-space {
            height: 100vh;
            background-color: #fff;
            padding: 50px;
            margin-bottom: 30px;
            border-radius: 10px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Pacifico&family=Open+Sans&display=swap" rel="stylesheet">

    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="closeSidebar()">×</button>
        <input type="text" id="search-bar" onkeyup="filterOptions()" placeholder="Search...">
        <a href="#home" onclick="showSection('home')">Home</a>
        <a href="#balita" onclick="showSection('balita')">Balita</a>
        <a href="#artikulo" onclick="showSection('artikulo')">Artikulo</a>
        <a href="#lathalain" onclick="showSection('lathalain')">Lathalain</a>
        <a href="#politika" onclick="showSection('politika')">Politika</a>
        <a href="#teknolohiya" onclick="showSection('teknolohiya')">Teknolohiya</a>
        <a href="#sports" onclick="showSection('sports')">Sports</a>
        <a href="#editoryal" onclick="showSection('editoryal')">Editoryal</a>
    </div>

    <div id="main">
        <div id="home" class="section active-section">
            <div class="welcome-container">
                <h1>Maligayang Pagdating sa Ang Sangyaw</h1>
                <p>Ang Sangyaw ay nag-aalok ng sariwang pananaw at mga kwento sa bawat aspeto ng ating buhay, mula sa mga pandaigdigang kaganapan hanggang sa mga lokal na balita at opinyon. Magsimula na tayo!</p>
            </div>
        </div>
    </div>

    <script>
        function openSidebar() {
            document.getElementById("sidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        }

        function closeSidebar() {
            document.getElementById("sidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
        }

        function showSection(sectionId) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                section.classList.remove('active-section');
            });
            document.getElementById(sectionId).classList.add('active-section');
        }

        function filterOptions() {
            const searchValue = document.getElementById("search-bar").value.toLowerCase();
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(link => {
                if (link.textContent.toLowerCase().includes(searchValue)) {
                    link.style.display = "block";
                } else {
                    link.style.display = "none";
                }
            });
        }
    </script>
